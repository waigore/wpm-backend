[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --cov=wpm_backend
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -v

# Coverage options
[coverage:run]
source = wpm_backend
omit = 
    */tests/*
    */__pycache__/*
    */__init__.py
    wpm_backend/cli.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 80

[coverage:html]
directory = htmlcov

