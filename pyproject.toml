[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waiz-wpm-backend"
version = "0.1.0"
description = "WPM Python FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "waiz-wpm @ git+https://github.com/waigore/wpmv2.git@dev",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "setuptools>=68.0.0",
    "wheel>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
wpm-backend-cli = "wpm_backend.cli:main"

[tool.setuptools]
packages = ["wpm_backend"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

